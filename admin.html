<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>One:18 — Admin Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#16283F; --navy-2:#1F3454; --gold:#C79A5D; --gold-light:#E7CE9F;
    --cream:#FAF6EE; --paper:#FFFFFF; --ink:#20303F; --slate:#6B7A8C; --line:#E4DCCB;
    --green:#4B7A5E; --green-bg:#EAF2ED; --red:#B5493B; --red-bg:#FBECE9; --radius:14px;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--cream); color:var(--ink); font-family:'Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased;}
  h1,h2,h3,.display{font-family:'Fraunces',Georgia,serif; font-weight:600; letter-spacing:-0.01em;}
  button{font-family:inherit; cursor:pointer;}

  .topbar{
    background:var(--navy); color:#fff; padding:16px 18px;
    display:flex; align-items:center; gap:12px; position:sticky; top:0; z-index:30;
    box-shadow:0 6px 16px rgba(22,40,63,0.18);
  }
  .seal{width:34px; height:34px; border-radius:50%; border:1.5px solid var(--gold-light); display:flex; align-items:center; justify-content:center; flex:none;}
  .seal::before{content:"✦"; color:var(--gold-light); font-size:14px;}
  .brand{flex:1; min-width:0;}
  .brand .name{font-family:'Fraunces',serif; font-size:16px; font-weight:600;}
  .brand .tag{font-size:10.5px; color:var(--gold-light); letter-spacing:0.08em; text-transform:uppercase;}
  .icon-btn{background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.18); color:#fff; border-radius:10px; padding:8px 12px; font-size:12.5px;}

  main{max-width:900px; margin:0 auto; padding:18px 16px 60px;}

  /* login */
  .login-gate{position:fixed; inset:0; background:var(--navy); z-index:100; display:flex; align-items:center; justify-content:center; padding:24px;}
  .login-gate.hidden{display:none;}
  .login-card{background:var(--paper); width:100%; max-width:340px; border-radius:16px; padding:26px 22px; text-align:center;}
  .login-seal{width:44px; height:44px; border-radius:50%; border:1.5px solid var(--gold); margin:0 auto 14px; display:flex; align-items:center; justify-content:center;}
  .login-seal::before{content:"✦"; color:var(--gold); font-size:18px;}
  .login-card h2{margin:0 0 4px; font-size:19px; color:var(--navy);}
  .login-sub{font-size:12.5px; color:var(--slate); margin:0 0 18px;}
  .login-field{text-align:left; margin-bottom:12px;}
  .login-field label{display:block; font-size:10.5px; color:var(--slate); text-transform:uppercase; letter-spacing:0.05em; margin-bottom:4px;}
  .login-field input{width:100%; border:1.3px solid var(--line); border-radius:9px; padding:10px 11px; font-size:14px; outline:none; background:#FCFAF4;}
  .login-error{display:none; background:var(--red-bg); color:var(--red); font-size:12px; border-radius:8px; padding:8px 10px; margin-bottom:12px; text-align:left;}
  .login-error.show{display:block;}
  .login-btn{width:100%; background:var(--navy); color:#fff; border:none; border-radius:10px; padding:12px; font-size:14px; font-weight:700;}
  .login-btn:disabled{opacity:0.6;}
  .not-admin{color:var(--red); font-size:12.5px; margin-top:10px;}

  /* filters */
  .filter-row{display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap;}
  .filter-row input, .filter-row select{
    border:1.3px solid var(--line); border-radius:9px; padding:9px 11px; font-size:13.5px; background:var(--paper); outline:none;
  }
  .filter-row input{flex:1; min-width:160px;}

  /* job list */
  .job-card{
    background:var(--paper); border:1px solid var(--line); border-radius:var(--radius);
    padding:14px; margin-bottom:10px; cursor:pointer; display:flex; gap:12px; align-items:center;
  }
  .job-card:hover{border-color:var(--gold);}
  .job-thumb{width:52px; height:52px; border-radius:10px; object-fit:cover; flex:none; background:var(--line);}
  .job-thumb-placeholder{
    width:52px; height:52px; border-radius:10px; flex:none; background:var(--cream); border:1px dashed var(--line);
    display:flex; align-items:center; justify-content:center; color:var(--slate); font-size:18px;
  }
  .job-info{flex:1; min-width:0;}
  .job-info .jn{font-weight:600; font-size:14.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .job-info .jm{font-size:12px; color:var(--slate); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .job-side{text-align:right; flex:none;}
  .pct{font-family:'Fraunces',serif; font-size:15px; color:var(--gold);}
  .status-pill{
    display:inline-block; font-size:9.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.04em;
    padding:2px 8px; border-radius:20px; margin-top:4px;
  }
  .status-pill.submitted{background:var(--green-bg); color:var(--green); border:1px solid var(--green);}
  .status-pill.in_progress{background:var(--cream); color:var(--slate); border:1px solid var(--line);}
  .status-pill.archived{background:#F0F0F0; color:#888; border:1px solid #CCC;}
  .card-actions{display:flex; gap:6px; margin-top:6px; justify-content:flex-end;}
  .card-btn{background:none; border:1px solid var(--line); border-radius:7px; padding:4px 9px; font-size:11px; cursor:pointer; font-weight:600;}
  .card-btn.assign{color:var(--navy); border-color:var(--navy);}
  .card-btn.assign:hover{background:#EEF2F9;}
  .card-btn.archive:hover{border-color:var(--slate); background:var(--cream);}
  .card-btn.unarchive{color:var(--green); border-color:var(--green);}
  .card-btn.delete{color:var(--red); border-color:var(--red-bg);}
  .card-btn.delete:hover{background:var(--red-bg);}
  .search-wrap{display:flex; gap:8px; margin-bottom:10px; flex-wrap:wrap;}
  .search-wrap input{flex:1; min-width:180px; border:1.3px solid var(--line); border-radius:9px; padding:9px 11px; font-size:13.5px; background:var(--paper); outline:none;}
  .search-wrap select{border:1.3px solid var(--line); border-radius:9px; padding:9px 11px; font-size:13.5px; background:var(--paper); outline:none;}

  .empty-msg{text-align:center; color:var(--slate); padding:40px 20px; font-size:13.5px;}

  /* detail view */
  .detail-overlay{position:fixed; inset:0; background:var(--cream); z-index:50; overflow-y:auto; display:none;}
  .detail-overlay.open{display:block;}
  .detail-top{background:var(--navy); color:#fff; padding:16px 18px; position:sticky; top:0; z-index:5;}
  .detail-top .back{background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.2); color:#fff; border-radius:9px; padding:7px 12px; font-size:12.5px; margin-bottom:10px;}
  .detail-top h2{margin:0; font-size:19px;}
  .detail-top .sub{font-size:12px; color:rgba(255,255,255,0.65); margin-top:3px;}
  .detail-body{max-width:700px; margin:0 auto; padding:16px 16px 60px;}

  .detail-hero{width:100%; max-height:220px; object-fit:cover; border-radius:14px; margin-bottom:14px; display:block;}
  .info-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px;}
  .info-box{background:var(--paper); border:1px solid var(--line); border-radius:10px; padding:10px 12px;}
  .info-box label{display:block; font-size:9.5px; text-transform:uppercase; letter-spacing:0.05em; color:var(--slate); margin-bottom:3px;}
  .info-box div{font-size:13.5px; font-weight:600;}

  .sec-card{background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); padding:14px; margin-bottom:12px;}
  .sec-card h3{margin:0 0 2px; font-size:15px;}
  .sec-frac{font-size:12px; color:var(--slate); margin-bottom:10px;}
  .item-row{display:flex; align-items:flex-start; gap:8px; padding:5px 0; font-size:13.5px; border-bottom:1px solid #F1EDE2;}
  .item-row:last-child{border-bottom:none;}
  .item-row .tick{flex:none; width:16px; text-align:center;}
  .item-row.done{color:var(--slate);}
  .item-row.done .tick{color:var(--green);}
  .item-row:not(.done) .tick{color:var(--line);}
  .item-row.editable{cursor:pointer; user-select:none;}
  .item-row.editable:hover{background:var(--cream);}
  .item-note{background:var(--red-bg); border-radius:8px; padding:8px 10px; font-size:12.5px; color:#7A392F; margin:6px 0 6px 24px;}
  .item-note-edit{
    width:calc(100% - 24px); margin:6px 0 6px 24px; min-height:50px; resize:vertical;
    border:1.3px solid var(--line); border-radius:8px; padding:7px 9px; font-family:'Inter',sans-serif;
    font-size:12.5px; color:var(--ink); background:#FCFAF4; outline:none;
  }
  .edit-field{
    width:100%; border:1.3px solid var(--line); border-radius:8px; padding:7px 9px;
    font-size:13.5px; font-weight:600; font-family:'Inter',sans-serif; color:var(--ink); background:#FCFAF4; outline:none;
  }
  .save-bar{
    position:sticky; bottom:0; background:var(--paper); border-top:1px solid var(--line);
    padding:12px 16px; display:flex; gap:10px; z-index:6;
  }
  .save-btn{flex:1; background:var(--green); color:#fff; border:none; border-radius:10px; padding:12px; font-size:14px; font-weight:700;}
  .save-btn:disabled{opacity:0.6;}
  .delete-btn{background:var(--red-bg); color:var(--red); border:1px solid var(--red); border-radius:10px; padding:12px 16px; font-size:13px; font-weight:700;}
  .quote-card{
    border:1.5px solid var(--line); border-radius:12px; padding:14px; margin-bottom:12px; background:var(--cream);
  }
  .quote-card-head{font-weight:700; font-size:14px; margin-bottom:4px;}
  .quote-card-meta{font-size:12px; color:var(--slate); margin-bottom:10px; line-height:1.6;}
  .quote-addons{font-size:11.5px; color:var(--navy); background:#EEF2F9; border-radius:6px; padding:4px 8px; margin-bottom:10px; font-weight:600;}
  .quote-assign-row{display:flex; gap:8px; align-items:center;}
  .quote-assign-row input{flex:1; border:1.3px solid var(--line); border-radius:8px; padding:8px 10px; font-size:13px; background:#fff; font-family:'Inter',sans-serif;}
  .quote-assign-row button{background:var(--navy); color:#fff; border:none; border-radius:8px; padding:8px 14px; font-size:12.5px; font-weight:700; cursor:pointer; flex:none;}
  .quote-created{color:var(--green); font-size:12px; font-weight:700; padding:6px 0;}
  .modified-badge{
    font-size:10.5px; color:var(--red); font-weight:600; margin-top:3px;
    background:var(--red-bg); border-radius:6px; padding:2px 7px; display:inline-block;
  }
  .ledger-wrap{ margin-bottom:16px; }
  .ledger-section-head{
    font-size:13px; font-weight:700; padding:10px 14px;
    border-radius:10px 10px 0 0; margin-bottom:0;
  }
  .ledger-section-head.unreviewed{
    background:#FFF7E6; color:#7A4F00; border:1.5px solid #E8A838; border-bottom:none;
  }
  .ledger-entry{
    border:1.5px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:8px;
  }
  .ledger-entry.unreviewed-entry{
    border-color:#E8A838; background:#FFFCF4;
    border-radius:0 0 10px 10px; margin-bottom:10px;
  }
  .ledger-entry.reviewed{
    background:var(--cream); border-color:var(--line); opacity:0.85;
  }
  .ledger-entry-head{
    display:flex; align-items:center; gap:8px; margin-bottom:6px;
  }
  .ledger-dot{
    width:8px; height:8px; border-radius:50%; background:#E8A838; flex:none;
  }
  .ledger-entry.reviewed .ledger-dot{ background:var(--slate); }
  .ledger-meta{ font-size:12.5px; color:var(--ink); flex:1; }
  .ledger-reviewed-tag{
    font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:0.05em;
    color:var(--green); background:var(--green-bg); border:1px solid var(--green);
    border-radius:20px; padding:2px 7px; flex:none;
  }
  .ledger-changes{
    margin:4px 0 8px 16px; padding:0; font-size:12.5px; color:var(--ink); line-height:1.6;
  }
  .ledger-changes li{ padding:1px 0; }
  .ledger-review-btn{
    background:var(--navy); color:#fff; border:none; border-radius:8px;
    padding:8px 14px; font-size:12px; font-weight:700; cursor:pointer; width:100%;
  }
  .save-status{text-align:center; font-size:11.5px; color:var(--slate); padding:6px 0 0;}

  .mode-tabs{display:flex; gap:8px; margin-top:12px;}
  .mode-tab{
    flex:1; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.2); color:rgba(255,255,255,0.75);
    border-radius:9px; padding:9px; font-size:13px; font-weight:600;
  }
  .mode-tab.active{background:var(--gold); border-color:var(--gold); color:var(--navy);}
  .view-text{font-size:13.5px; font-weight:600; padding:2px 0;}
  .view-note{background:var(--red-bg); border-radius:8px; padding:8px 10px; font-size:12.5px; color:#7A392F; margin:6px 0 6px 24px;}
  .item-photos{display:flex; flex-wrap:wrap; gap:6px; margin:4px 0 8px 24px;}
  .item-photos img{width:56px; height:56px; border-radius:7px; object-fit:cover; cursor:pointer; border:1px solid var(--line);}
  .sec-photos{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; padding-top:10px; border-top:1px dashed var(--line);}
  .sec-photos img{width:64px; height:64px; border-radius:8px; object-fit:cover; cursor:pointer; border:1px solid var(--line);}
  .instance-label{font-size:12px; font-weight:700; color:var(--navy); text-transform:uppercase; letter-spacing:0.04em; margin:10px 0 4px;}

  .contractor-card{
    background:var(--paper); border:1.5px solid var(--line); border-radius:12px; padding:14px;
    margin-bottom:10px; cursor:pointer; display:flex; align-items:center; gap:12px;
  }
  .contractor-card:hover{ border-color:var(--gold); }
  .contractor-card.selected{ border-color:var(--navy); background:#EEF2F9; }
  .contractor-avatar{
    width:42px; height:42px; border-radius:50%; background:var(--navy); color:var(--gold-light);
    display:flex; align-items:center; justify-content:center; font-family:'Fraunces',serif;
    font-size:17px; font-weight:600; flex:none;
  }
  .contractor-info{ flex:1; min-width:0; }
  .contractor-info .cn{ font-weight:700; font-size:14px; }
  .contractor-info .ce{ font-size:12px; color:var(--slate); margin-top:1px; }
  .contractor-info .cj{ font-size:11.5px; color:var(--navy); margin-top:2px; font-weight:600; }
  .contractor-view{ display:none; }
  .contractor-view.open{ display:block; }
  .contractor-section{ margin-bottom:20px; }
  .contractor-section-head{
    display:flex; align-items:center; gap:10px; padding:12px 14px;
    background:var(--navy); color:#fff; border-radius:12px 12px 0 0; margin-bottom:0;
  }
  .contractor-section-head .cn{ font-family:'Fraunces',serif; font-size:16px; font-weight:600; flex:1; }
  .contractor-section-head .stats{ font-size:12px; color:rgba(255,255,255,0.7); }
  .contractor-job-row{
    display:flex; align-items:center; gap:10px; padding:10px 14px; background:var(--paper);
    border-left:1.5px solid var(--line); border-right:1.5px solid var(--line); border-bottom:1px solid #F1EDE2;
    cursor:pointer;
  }
  .contractor-job-row:last-child{ border-bottom:1.5px solid var(--line); border-radius:0 0 12px 12px; }
  .contractor-job-row:hover{ background:var(--cream); }
  .contractor-job-row .jname{ flex:1; font-size:13.5px; font-weight:600; min-width:0; }
  .contractor-job-row .jmeta{ font-size:11.5px; color:var(--slate); }
  .tab-row{ display:flex; gap:8px; margin-bottom:14px; }
  .tab-btn{ flex:1; padding:9px; border-radius:10px; border:1.5px solid var(--line); background:var(--paper); color:var(--slate); font-size:13px; font-weight:600; cursor:pointer; }
  .tab-btn.active{ background:var(--navy); border-color:var(--navy); color:#fff; }

  .lightbox{position:fixed; inset:0; background:rgba(10,16,24,0.9); z-index:90; display:none; align-items:center; justify-content:center; padding:20px;}
  .lightbox.open{display:flex;}
  .lightbox img{max-width:100%; max-height:85vh; border-radius:10px;}
  .lightbox-close{position:absolute; top:18px; right:18px; background:rgba(255,255,255,0.15); color:#fff; border:none; width:36px; height:36px; border-radius:50%; font-size:18px;}
</style>
</head>
<body>

<div class="login-gate" id="loginGate">
  <div class="login-card">
    <div class="login-seal"></div>
    <h2>One:18 Admin</h2>
    <p class="login-sub">Sign in to view job records</p>
    <div class="login-field">
      <label>Email</label>
      <input type="email" id="loginEmail" autocomplete="username" placeholder="you@example.com">
    </div>
    <div class="login-field">
      <label>Password</label>
      <input type="password" id="loginPassword" autocomplete="current-password" placeholder="••••••••">
    </div>
    <div class="login-error" id="loginError"></div>
    <button class="login-btn" id="loginBtn">Log In</button>
    <div class="not-admin" id="notAdminMsg" style="display:none;">This account isn't set up for admin access.</div>
  </div>
</div>

<div class="topbar">
  <div class="seal"></div>
  <div class="brand">
    <div class="name">One:18 Cleaning</div>
    <div class="tag">Admin Dashboard</div>
  </div>
  <button class="icon-btn" id="contractorsBtn" style="margin-right:6px;">👤 Team</button>
  <button class="icon-btn" id="createJobBtn" style="margin-right:6px;">+ Job</button>
  <button class="icon-btn" id="logoutBtn">Log out</button>
</div>

<div class="login-gate" id="createJobModal" style="display:none; background:rgba(20,30,45,0.7); align-items:flex-end;">
  <div style="background:var(--paper); width:100%; max-width:640px; border-radius:18px 18px 0 0; padding:20px 18px 28px; max-height:90vh; overflow-y:auto;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
      <h3 style="margin:0; font-size:18px;">Assign New Job</h3>
      <button id="createJobCloseBtn" style="background:none; border:none; font-size:20px; cursor:pointer; color:var(--slate);">✕</button>
    </div>
    <div class="login-field">
      <label>Assign to contractor (email)</label>
      <input type="email" id="cjContractor" placeholder="e.g. calebo2g@hotmail.com">
    </div>
    <div class="login-field">
      <label>Client name</label>
      <input type="text" id="cjClient" placeholder="e.g. John Smith">
    </div>
    <div class="login-field">
      <label>Property address</label>
      <input type="text" id="cjAddress" placeholder="Street, city">
    </div>
    <div class="login-field">
      <label>Service date</label>
      <input type="date" id="cjDate">
    </div>
    <div class="login-field">
      <label>Service level</label>
      <select id="cjServiceLevel" style="width:100%; border:1.3px solid var(--line); border-radius:9px; padding:10px 11px; font-size:14px; background:#FCFAF4;">
        <option value="standard">Standard Clean</option>
        <option value="deep">Deep Clean</option>
        <option value="move">Move-In / Move-Out</option>
      </select>
    </div>
    <div class="login-field">
      <label>Job name / reference (optional)</label>
      <input type="text" id="cjName" placeholder="e.g. Smith Residence - Aug 2026">
    </div>
    <div class="login-error" id="cjError"></div>
    <button class="login-btn" id="cjSaveBtn" style="margin-top:8px;">Create & Assign Job</button>
  </div>
</div>

<main>
  <div class="tab-row">
    <button class="tab-btn active" id="tabJobs">Jobs</button>
    <button class="tab-btn" id="tabContractors">Team</button>
  </div>

  <!-- Jobs view -->
  <div id="jobsView">
    <div class="search-wrap">
      <input type="text" id="searchInput" placeholder="Search by name, client, address, contractor...">
      <select id="statusFilter">
        <option value="active" selected>All active jobs</option>
        <option value="submitted">Submitted</option>
        <option value="in_progress">In progress</option>
        <option value="archived">Archived</option>
      </select>
    </div>
    <div id="jobListArea"></div>
  </div>

  <!-- Contractors view -->
  <div id="contractorsView" class="contractor-view">
    <div style="background:var(--paper); border:1.5px solid var(--line); border-radius:12px; padding:14px; margin-bottom:16px;">
      <div style="font-weight:700; font-size:14px; margin-bottom:10px;">Add a contractor</div>
      <div style="display:flex; gap:8px; flex-wrap:wrap;">
        <input type="text" id="newCtName" placeholder="Name" style="flex:1; min-width:100px; border:1.3px solid var(--line); border-radius:8px; padding:8px 10px; font-size:13px; font-family:'Inter',sans-serif;">
        <input type="email" id="newCtEmail" placeholder="Email" style="flex:2; min-width:160px; border:1.3px solid var(--line); border-radius:8px; padding:8px 10px; font-size:13px; font-family:'Inter',sans-serif;">
        <button id="addContractorBtn" style="background:var(--navy); color:#fff; border:none; border-radius:8px; padding:8px 14px; font-size:13px; font-weight:700; cursor:pointer;">Add</button>
      </div>
    </div>
    <div id="contractorsList"></div>
  </div>
</main>

<!-- Assign job modal -->

<script>
(function(){

  const SUPABASE_URL = 'https://qbicdeyirtvavlkrarcy.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_pvN11J0EDjEVsuCvXHVung_3Eh2VjVj';
  const ADMIN_EMAILS = ['one18cleaning@gmail.com'];
  const SESSION_KEY = 'one18_admin_session';

  let session = null;
  let allJobs = []; // [{id, data, status, submitted_at, created_by, updated_at}]

  const $ = id => document.getElementById(id);

  function toast(msg){
    const el = $('adminToast');
    el.textContent = msg;
    el.style.opacity = '1';
    clearTimeout(toast._t);
    toast._t = setTimeout(()=>{ el.style.opacity = '0'; }, 1800);
  }

  /* ---------------- Section schema (must mirror the contractor app) ---------------- */
  const SCHEMA = [
    { key:'arrival', num:1, title:'Arrival & Property Entry',
      items:['Parked legally, not blocking access','Used approved entry method only','Completed brief visual walkthrough','Documented pre-existing damage / unusual conditions','Verified client-requested priorities in scope','Exterior doors secured while working'],
      itemPhotoIndices:[3]},
    { key:'kitchen', num:2, title:'Kitchen',
      items:['Removed trash, replaced liner','Dusted/wiped surfaces & cabinet fronts','Cleaned & sanitized counters and backsplash','Cleaned sink, faucet, drain area, fixtures','Wiped exterior of fridge, dishwasher, oven, microwave','Cleaned stovetop','Cleaned microwave interior (if in scope)','Spot-cleaned switches, handles, doors','Vacuumed/swept & mopped floor, including edges'],
      deepItems:['Detailed cabinet-front cleaning & reachable trim','Detailed backsplash, grout, fixture buildup','Baseboards and door frames','Reachable light fixtures/fans','Intensive grease/buildup removal','Inside fridge/oven/cabinets (only if booked)']},
    { key:'bathrooms', num:3, title:'Bathroom(s)', repeatable:true, instanceLabel:'Bathroom',
      items:['Removed trash, replaced liner','Cleaned & disinfected toilet (exterior, seat, rim, bowl, base)','Cleaned vanity, sink, faucet, counter, backsplash','Cleaned mirrors streak-free','Cleaned tub/shower surfaces, fixtures, glass','Wiped shelving & exterior cabinetry','Spot-cleaned switches, handles, doors','Vacuumed/swept & mopped floor'],
      deepItems:['Detailed grout/edge work & buildup removal','Baseboards, doors, frames, reachable vents/fixtures','Shower-door tracks & fixture buildup','Exterior cabinetry detailing','Extra time on soap scum / mineral residue']},
    { key:'bedrooms', num:4, title:'Bedroom(s)', repeatable:true, instanceLabel:'Bedroom',
      items:['Dusted reachable furniture & surfaces','Cleaned mirrors & accessible glass','Spot-cleaned switches, handles, doors','Made bed (if included)','Vacuumed carpet/edges; mopped hard flooring','Emptied trash, reset room neatly']},
    { key:'living', num:5, title:'Living / Dining / Office Areas',
      items:['Dusted furniture, shelving, decor, lamps','Used caution around electronics — no direct spray','Cleaned mirrors/glass surfaces in scope','Straightened cushions & light decor only','Vacuumed upholstery (only if included)','Vacuumed/swept & mopped floor']},
    { key:'floors', num:6, title:'Floors — Whole Property',
      items:['Identified flooring type before chemicals/water','Vacuumed/swept thoroughly before mopping','Minimal moisture used on wood/laminate','No abrasive pads/unapproved chemicals on stone or specialty finishes','Floors free of visible debris, hair, mop streaks']},
    { key:'walkthrough', num:7, title:'Final Walkthrough',
      items:['Kitchen counters/sink/stovetop visually clean & reset','Bathroom mirrors, fixtures, toilet, floors checked','No visible debris/hair in floor edges or corners','Trash removed, liners replaced','Belongings returned to original position','Lights, fans, thermostat, doors, windows, locks set per instructions','All supplies/tools/wet cloths removed — nothing left behind','Any damage or unusual condition documented & reported']}
  ];

  function sectionCounts(sec, state, job){
    const deepOn = job.serviceLevel === 'deep' && sec.deepItems;
    const total = sec.items.length + (deepOn ? sec.deepItems.length : 0);
    let done = 0;
    sec.items.forEach((_,i)=>{ if(state.items && state.items[i]) done++; });
    if(deepOn){ sec.deepItems.forEach((_,i)=>{ if(state.items && state.items['d'+i]) done++; }); }
    return {done, total};
  }
  function computePctForJob(job){
    let done=0, total=0;
    SCHEMA.forEach(sec=>{
      if(sec.repeatable){
        (job.sections && job.sections[sec.key] || []).forEach(inst=>{
          const c = sectionCounts(sec, inst, job); done+=c.done; total+=c.total;
        });
      } else if(job.sections && job.sections[sec.key]){
        const c = sectionCounts(sec, job.sections[sec.key], job); done+=c.done; total+=c.total;
      }
    });
    return total ? Math.round(done/total*100) : 0;
  }

  /* ---------------- Auth ---------------- */
  function authHeaders(){
    return { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${session ? session.access_token : SUPABASE_KEY}`, 'Content-Type':'application/json' };
  }
  function saveSession(s){ session = s; try{ localStorage.setItem(SESSION_KEY, JSON.stringify(s)); }catch(e){} }
  function clearSession(){ session = null; try{ localStorage.removeItem(SESSION_KEY); }catch(e){} }
  function loadStoredSession(){ try{ const r = localStorage.getItem(SESSION_KEY); return r ? JSON.parse(r) : null; }catch(e){ return null; } }
  function sessionFromAuthResponse(body, fallbackEmail){
    return { access_token: body.access_token, refresh_token: body.refresh_token, expires_at: Date.now() + body.expires_in*1000, email: (body.user && body.user.email) || fallbackEmail };
  }
  async function signIn(email, password){
    const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
      method:'POST', headers:{'apikey':SUPABASE_KEY,'Content-Type':'application/json'}, body: JSON.stringify({email,password})
    });
    const body = await res.json();
    if(!res.ok) throw new Error(body.error_description || body.msg || 'Login failed');
    const s = sessionFromAuthResponse(body, email);
    saveSession(s);
    return s;
  }
  async function refreshSession(s){
    try{
      const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=refresh_token`, {
        method:'POST', headers:{'apikey':SUPABASE_KEY,'Content-Type':'application/json'}, body: JSON.stringify({refresh_token:s.refresh_token})
      });
      if(!res.ok) return null;
      const body = await res.json();
      const ns = sessionFromAuthResponse(body, s.email);
      saveSession(ns);
      return ns;
    }catch(e){ return null; }
  }
  async function ensureSession(){
    let s = loadStoredSession();
    if(!s) return null;
    if(s.expires_at - Date.now() < 60000){ s = await refreshSession(s); }
    if(s) session = s;
    return s;
  }
  function isAdmin(){ return session && ADMIN_EMAILS.includes((session.email||'').toLowerCase()); }

  /* ---------------- Data ---------------- */
  async function loadAllJobs(){
    try{
      const res = await fetch(`${SUPABASE_URL}/rest/v1/jobs?select=id,data,status,submitted_at,created_by,assigned_to,updated_at&order=updated_at.desc`, { headers: authHeaders() });
      if(!res.ok) throw new Error('Load failed: '+res.status);
      allJobs = await res.json();
    }catch(e){ console.error(e); allJobs = []; }
  }

  /* ---------------- List rendering ---------------- */
  function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  function renderList(){
    const q = $('searchInput').value.trim().toLowerCase();
    const statusF = $('statusFilter').value;
    const area = $('jobListArea');
    area.innerHTML = '';

    let filtered = allJobs.filter(j=>{
      const d = j.data || {};
      const isArchived = j.status === 'archived';
      if(statusF === 'active' && isArchived) return false;
      if(statusF === 'archived' && !isArchived) return false;
      if(statusF === 'submitted' && j.status !== 'submitted') return false;
      if(statusF === 'in_progress' && j.status !== 'in_progress') return false;
      if(q){
        const hay = [d.name, d.client, d.address, d.clientEmail, d.clientPhone,
          d.notes, j.created_by, j.assigned_to, d.assignedTo, d.date
        ].filter(Boolean).join(' ').toLowerCase();
        if(!hay.includes(q)) return false;
      }
      return true;
    });

    if(filtered.length === 0){
      area.innerHTML = `<div class="empty-msg">${q?'No jobs match "'+escapeHtml(q)+'"':'No jobs here yet.'}</div>`;
      return;
    }

    filtered.forEach(j=>{
      const d = j.data || {};
      const pct = computePctForJob(d);
      const isArchived = j.status === 'archived';
      const card = document.createElement('div');
      card.className = 'job-card';
      card.style.opacity = isArchived ? '0.6' : '1';

      const thumbHtml = d.photo
        ? `<img class="job-thumb" src="${d.photo}" alt="">`
        : `<div class="job-thumb-placeholder">🏠</div>`;
      const unreviewedCount = (d.editLedger||[]).filter(e=>!e.reviewed).length;
      const modifiedBadge = unreviewedCount > 0
        ? `<div class="modified-badge">⚠ ${unreviewedCount} unreviewed edit${unreviewedCount>1?'s':''}</div>`
        : '';
      const contractorLine = (j.created_by === 'gmail-import' || j.created_by === 'one18cleaning@gmail.com')
        ? '👤 ' + escapeHtml(j.assigned_to || d.assignedTo || 'Unassigned')
        : 'By ' + escapeHtml(j.created_by || '');
      const statusLabel = isArchived ? 'Archived' : j.status === 'submitted' ? 'Submitted' : 'In progress';

      card.innerHTML = `
        ${thumbHtml}
        <div class="job-info">
          <div class="jn">${escapeHtml(d.name || 'Untitled job')}</div>
          <div class="jm">${escapeHtml(d.client || 'No client')}${d.address ? ' · '+escapeHtml(d.address) : ''}</div>
          <div class="jm">${contractorLine}${d.date ? ' · 📅 '+escapeHtml(d.date) : ''}</div>
          ${modifiedBadge}
          <div class="card-actions">
            <button class="card-btn assign">Assign</button>
            <button class="card-btn ${isArchived?'unarchive':'archive'}">${isArchived?'Unarchive':'Archive'}</button>
            <button class="card-btn delete">Delete</button>
          </div>
        </div>
        <div class="job-side">
          <div class="pct">${pct}%</div>
          <div class="status-pill ${j.status}">${statusLabel}</div>
        </div>
      `;

      card.addEventListener('click', e=>{
        if(e.target.closest('.card-actions')) return;
        openDetail(j);
      });

      card.querySelector('.card-btn.assign').onclick = e=>{
        e.stopPropagation();
        openAssignModal(j);
      };

      card.querySelector(`.card-btn.${isArchived?'unarchive':'archive'}`).onclick = async e=>{
        e.stopPropagation();
        const newStatus = isArchived ? (d.submittedAt ? 'submitted' : 'in_progress') : 'archived';
        try{
          await fetch(`${SUPABASE_URL}/rest/v1/jobs?id=eq.${encodeURIComponent(j.id)}`, {
            method:'PATCH', headers:{...authHeaders(),'Prefer':'return=minimal'},
            body: JSON.stringify({ status: newStatus, archived_at: isArchived ? null : new Date().toISOString() })
          });
          j.status = newStatus;
          toast(isArchived ? 'Job unarchived' : 'Job archived');
          renderList();
        }catch(err){ alert('Could not update job'); }
      };

      card.querySelector('.card-btn.delete').onclick = async e=>{
        e.stopPropagation();
        const name = d.name || d.client || 'this job';
        if(!confirm(`Permanently delete "${escapeHtml(name)}"? This cannot be undone.`)) return;
        try{
          await fetch(`${SUPABASE_URL}/rest/v1/jobs?id=eq.${encodeURIComponent(j.id)}`, {
            method:'DELETE', headers: authHeaders()
          });
          allJobs = allJobs.filter(x=>x.id !== j.id);
          toast('Job deleted');
          renderList();
        }catch(err){ alert('Could not delete job'); }
      };

      area.appendChild(card);
    });
  }

  /* ---------------- Change summary diff ---------------- */
  function generateChangeSummary(snapshot, d){
    const changes = [];
    const snap = snapshot.details || {};
    const fieldLabels = { name:'Job name', client:'Client', date:'Service date', address:'Address', serviceLevel:'Service level' };
    Object.keys(fieldLabels).forEach(f=>{
      const before = snap[f] || '';
      const after = d[f] || '';
      if(before !== after){
        const label = fieldLabels[f];
        const bVal = f==='serviceLevel' ? (before==='deep'?'Deep Clean':'Standard Clean') : (before||'—');
        const aVal = f==='serviceLevel' ? (after==='deep'?'Deep Clean':'Standard Clean') : (after||'—');
        changes.push(`${label} changed: "${bVal}" → "${aVal}"`);
      }
    });

    const snapSecs = snapshot.sections || {};
    SCHEMA.forEach(sec=>{
      if(sec.repeatable){
        const snapInsts = snapSecs[sec.key] || [];
        const currInsts = (d.sections && d.sections[sec.key]) || [];
        currInsts.forEach((inst, idx)=>{
          const snapInst = snapInsts[idx] || { items:{}, itemNotes:{} };
          const lbl = inst.label || `${sec.instanceLabel} ${idx+1}`;
          sec.items.forEach((text,i)=>{
            const was = !!(snapInst.items && snapInst.items[i]);
            const now = !!(inst.items && inst.items[i]);
            if(was !== now) changes.push(`${sec.title} — ${lbl}: "${text}" ${now?'checked':'unchecked'}`);
          });
          if(sec.deepItems){
            sec.deepItems.forEach((text,i)=>{
              const key='d'+i;
              const was = !!(snapInst.items && snapInst.items[key]);
              const now = !!(inst.items && inst.items[key]);
              if(was !== now) changes.push(`${sec.title} — ${lbl} (deep): "${text}" ${now?'checked':'unchecked'}`);
            });
          }
          if(sec.itemPhotoIndices){
            sec.itemPhotoIndices.forEach(i=>{
              const wasNote = (snapInst.itemNotes && snapInst.itemNotes[i]) || '';
              const nowNote = (inst.itemNotes && inst.itemNotes[i]) || '';
              if(wasNote !== nowNote) changes.push(`${sec.title} — ${lbl}: damage/condition note updated`);
              const wasPhotos = ((snapInst.itemPhotos && snapInst.itemPhotos[i]) || []).length;
              const nowPhotos = ((inst.itemPhotos && inst.itemPhotos[i]) || []).length;
              if(nowPhotos > wasPhotos) changes.push(`${sec.title} — ${lbl}: ${nowPhotos - wasPhotos} damage photo(s) added`);
            });
          }
          const wasPhotos = (snapInst.photos || []).length;
          const nowPhotos = (inst.photos || []).length;
          if(nowPhotos > wasPhotos) changes.push(`${sec.title} — ${lbl}: ${nowPhotos - wasPhotos} section photo(s) added`);
        });
      } else {
        const snapState = snapSecs[sec.key] || { items:{}, itemNotes:{} };
        const currState = (d.sections && d.sections[sec.key]) || { items:{} };
        sec.items.forEach((text,i)=>{
          const was = !!(snapState.items && snapState.items[i]);
          const now = !!(currState.items && currState.items[i]);
          if(was !== now) changes.push(`${sec.title}: "${text}" ${now?'checked':'unchecked'}`);
        });
        if(sec.deepItems){
          sec.deepItems.forEach((text,i)=>{
            const key='d'+i;
            const was = !!(snapState.items && snapState.items[key]);
            const now = !!(currState.items && currState.items[key]);
            if(was !== now) changes.push(`${sec.title} (deep): "${text}" ${now?'checked':'unchecked'}`);
          });
        }
        if(sec.itemPhotoIndices){
          sec.itemPhotoIndices.forEach(i=>{
            const wasNote = (snapState.itemNotes && snapState.itemNotes[i]) || '';
            const nowNote = (currState.itemNotes && currState.itemNotes[i]) || '';
            if(wasNote !== nowNote) changes.push(`${sec.title}: damage/condition note updated`);
            const wasP = ((snapState.itemPhotos && snapState.itemPhotos[i]) || []).length;
            const nowP = ((currState.itemPhotos && currState.itemPhotos[i]) || []).length;
            if(nowP > wasP) changes.push(`${sec.title}: ${nowP - wasP} damage photo(s) added`);
          });
        }
        const wasPhotos = (snapState.photos || []).length;
        const nowPhotos = (currState.photos || []).length;
        if(nowPhotos > wasPhotos) changes.push(`${sec.title}: ${nowPhotos - wasPhotos} section photo(s) added`);
      }
    });
    return changes;
  }

  /* ---------------- Detail rendering (view / edit modes) ---------------- */
  let currentDetailJob = null; // reference into allJobs currently open
  let detailMode = 'view';

  function openDetail(j){
    currentDetailJob = j;
    detailMode = 'view';
    updateModeTabs();
    renderDetail();
    $('detailOverlay').classList.add('open');
  }

  function updateModeTabs(){
    $('viewTabBtn').classList.toggle('active', detailMode === 'view');
    $('editTabBtn').classList.toggle('active', detailMode === 'edit');
    $('saveBar').style.display = detailMode === 'edit' ? 'flex' : 'none';
  }

  $('viewTabBtn').onclick = ()=>{ detailMode = 'view'; updateModeTabs(); renderDetail(); };
  $('editTabBtn').onclick = ()=>{ detailMode = 'edit'; updateModeTabs(); renderDetail(); };

  function renderDetail(){
    const j = currentDetailJob;
    const d = j.data || {};
    $('detailTitle').textContent = d.name || 'Untitled job';
    const dt = j.updated_at ? new Date(j.updated_at).toLocaleString() : '';
    $('detailSub').textContent = `${j.created_by ? j.created_by+' · ' : ''}${j.status === 'submitted' ? 'Submitted' : j.status === 'archived' ? 'Archived' : 'In progress'}${dt ? ' · Updated '+dt : ''}`;
    $('archiveJobBtn').textContent = j.status === 'archived' ? 'Unarchive' : 'Archive';
    $('saveStatus').textContent = '';

    const body = $('detailBody');
    body.innerHTML = '';

    // Show edit ledger if there are any entries
    const ledger = d.editLedger || [];
    const unreviewed = ledger.filter(e=>!e.reviewed);

    if(unreviewed.length > 0 || ledger.length > 0){
      const ledgerWrap = document.createElement('div');
      ledgerWrap.className = 'ledger-wrap';

      if(unreviewed.length > 0){
        const unreviewedHead = document.createElement('div');
        unreviewedHead.className = 'ledger-section-head unreviewed';
        unreviewedHead.innerHTML = `⚠ ${unreviewed.length} unreviewed edit${unreviewed.length>1?'s':''} after submission`;
        ledgerWrap.appendChild(unreviewedHead);
      }

      ledger.forEach((entry, idx)=>{
        const entryEl = document.createElement('div');
        entryEl.className = 'ledger-entry' + (entry.reviewed ? ' reviewed' : ' unreviewed-entry');
        const dt = new Date(entry.timestamp).toLocaleString();
        entryEl.innerHTML = `
          <div class="ledger-entry-head">
            <span class="ledger-dot"></span>
            <span class="ledger-meta"><strong>${escapeHtml(entry.email||'Contractor')}</strong> · ${dt}</span>
            ${entry.reviewed ? '<span class="ledger-reviewed-tag">Reviewed</span>' : ''}
          </div>
          <ul class="ledger-changes">${(entry.changes||[]).map(c=>`<li>${escapeHtml(c)}</li>`).join('')}</ul>
        `;
        if(!entry.reviewed){
          const reviewBtn = document.createElement('button');
          reviewBtn.className = 'ledger-review-btn';
          reviewBtn.textContent = '✓ Mark this edit as reviewed';
          reviewBtn.onclick = async ()=>{
            entry.reviewed = true;
            const allReviewed = (d.editLedger||[]).every(e=>e.reviewed);
            if(allReviewed) d.modifiedAfterSubmitAt = null;
            const j = currentDetailJob;
            try{
              await fetch(`${SUPABASE_URL}/rest/v1/jobs?id=eq.${encodeURIComponent(j.id)}`, {
                method:'PATCH',
                headers:{...authHeaders(),'Prefer':'return=minimal'},
                body: JSON.stringify({data:d, updated_at: new Date().toISOString()})
              });
              renderDetail();
              toast('Edit marked as reviewed');
            }catch(e){ alert('Could not save — check your connection.'); }
          };
          entryEl.appendChild(reviewBtn);
        }
        ledgerWrap.appendChild(entryEl);
      });

      body.appendChild(ledgerWrap);
    }

    if(d.photo){
      const img = document.createElement('img');
      img.className = 'detail-hero'; img.src = d.photo; img.alt = 'Property photo';
      img.onclick = ()=> openLightbox(d.photo);
      body.appendChild(img);
    }

    if(detailMode === 'edit'){
      renderHeaderEdit(body, j, d);
    } else {
      renderHeaderView(body, j, d);
    }

    SCHEMA.forEach(sec=>{
      if(sec.repeatable){
        const instances = (d.sections && d.sections[sec.key]) || [];
        instances.forEach(inst=>{
          body.appendChild(renderSectionCard(sec, inst, `${sec.title} — ${inst.label || ''}`, d));
        });
      } else {
        const state = (d.sections && d.sections[sec.key]) || {items:{}, photos:[]};
        body.appendChild(renderSectionCard(sec, state, sec.title, d));
      }
    });
  }

  function renderHeaderView(body, j, d){
    const grid = document.createElement('div');
    grid.className = 'info-grid';
    grid.innerHTML = `
      <div class="info-box"><label>Client</label><div class="view-text">${escapeHtml(d.client || '—')}</div></div>
      <div class="info-box"><label>Service date</label><div class="view-text">${escapeHtml(d.date || '—')}</div></div>
      <div class="info-box"><label>Address</label><div class="view-text">${escapeHtml(d.address || '—')}</div></div>
      <div class="info-box"><label>Service level</label><div class="view-text">${d.serviceLevel === 'deep' ? 'Deep Clean' : 'Standard Clean'}</div></div>
    `;
    body.appendChild(grid);
  }

  function renderHeaderEdit(body, j, d){
    const grid = document.createElement('div');
    grid.className = 'info-grid';
    grid.innerHTML = `
      <div class="info-box"><label>Job name</label><input class="edit-field" id="editName" value="${escapeHtml(d.name||'')}"></div>
      <div class="info-box"><label>Client</label><input class="edit-field" id="editClient" value="${escapeHtml(d.client||'')}"></div>
      <div class="info-box"><label>Service date</label><input class="edit-field" type="date" id="editDate" value="${escapeHtml(d.date||'')}"></div>
      <div class="info-box"><label>Address</label><input class="edit-field" id="editAddress" value="${escapeHtml(d.address||'')}"></div>
      <div class="info-box"><label>Service level</label>
        <select class="edit-field" id="editServiceLevel">
          <option value="standard" ${d.serviceLevel!=='deep'?'selected':''}>Standard Clean</option>
          <option value="deep" ${d.serviceLevel==='deep'?'selected':''}>Deep Clean</option>
        </select>
      </div>
      <div class="info-box"><label>Status</label>
        <select class="edit-field" id="editStatus">
          <option value="in_progress" ${j.status!=='submitted'?'selected':''}>In progress</option>
          <option value="submitted" ${j.status==='submitted'?'selected':''}>Submitted</option>
        </select>
      </div>
    `;
    body.appendChild(grid);
    ['editName','editClient','editDate','editAddress'].forEach(id=>{
      $(id).addEventListener('input', ()=>{
        const map = {editName:'name', editClient:'client', editDate:'date', editAddress:'address'};
        d[map[id]] = $(id).value;
      });
    });
    $('editServiceLevel').addEventListener('change', ()=>{ d.serviceLevel = $('editServiceLevel').value; renderDetail(); });
    $('editStatus').addEventListener('change', ()=>{
      j.status = $('editStatus').value;
      d.status = j.status;
      d.submittedAt = j.status === 'submitted' ? (d.submittedAt || Date.now()) : null;
    });
  }

  function renderSectionCard(sec, state, titleText, job){
    const c = sectionCounts(sec, state, job);
    const card = document.createElement('div');
    card.className = 'sec-card';
    card.innerHTML = `<h3>${escapeHtml(titleText)}</h3><div class="sec-frac">${c.done} / ${c.total} tasks complete</div>`;

    sec.items.forEach((text,i)=>{
      const row = document.createElement('div');
      const done = !!(state.items && state.items[i]);
      const editable = detailMode === 'edit';
      row.className = 'item-row' + (editable ? ' editable' : '') + (done ? ' done' : '');
      row.innerHTML = `<span class="tick">${done?'✓':'○'}</span><span>${escapeHtml(text)}</span>`;
      if(editable){
        row.onclick = ()=>{
          state.items = state.items || {};
          state.items[i] = !state.items[i];
          renderDetail();
        };
      }
      card.appendChild(row);

      const hasPhotoOpt = sec.itemPhotoIndices && sec.itemPhotoIndices.includes(i);
      if(hasPhotoOpt){
        state.itemNotes = state.itemNotes || {};
        if(editable){
          const noteArea = document.createElement('textarea');
          noteArea.className = 'item-note-edit';
          noteArea.placeholder = 'No notes recorded';
          noteArea.value = state.itemNotes[i] || '';
          noteArea.addEventListener('input', ()=>{ state.itemNotes[i] = noteArea.value; });
          card.appendChild(noteArea);
        } else if(state.itemNotes[i]){
          const noteEl = document.createElement('div');
          noteEl.className = 'view-note';
          noteEl.textContent = state.itemNotes[i];
          card.appendChild(noteEl);
        }

        const photos = (state.itemPhotos && state.itemPhotos[i]) || [];
        if(photos.length){
          const pWrap = document.createElement('div');
          pWrap.className = 'item-photos';
          photos.forEach(src=>{
            const img = document.createElement('img');
            img.src = src; img.onclick = ()=>openLightbox(src);
            pWrap.appendChild(img);
          });
          card.appendChild(pWrap);
        }
      }
    });

    if(job.serviceLevel === 'deep' && sec.deepItems){
      sec.deepItems.forEach((text,i)=>{
        const key = 'd'+i;
        const row = document.createElement('div');
        const done = !!(state.items && state.items[key]);
        const editable = detailMode === 'edit';
        row.className = 'item-row' + (editable ? ' editable' : '') + (done ? ' done' : '');
        row.innerHTML = `<span class="tick">${done?'✓':'○'}</span><span>${escapeHtml(text)} <span style="color:var(--gold); font-size:10px; font-weight:700;">DEEP</span></span>`;
        if(editable){
          row.onclick = ()=>{
            state.items = state.items || {};
            state.items[key] = !state.items[key];
            renderDetail();
          };
        }
        card.appendChild(row);
      });
    }

    const photos = state.photos || [];
    if(photos.length){
      const secPhotos = document.createElement('div');
      secPhotos.className = 'sec-photos';
      photos.forEach(src=>{
        const img = document.createElement('img');
        img.src = src; img.onclick = ()=>openLightbox(src);
        secPhotos.appendChild(img);
      });
      card.appendChild(secPhotos);
    }

    return card;
  }

  function openLightbox(src){ $('lightboxImg').src = src; $('lightbox').classList.add('open'); }
  $('lightboxClose').onclick = ()=> $('lightbox').classList.remove('open');
  $('lightbox').addEventListener('click', e=>{ if(e.target.id==='lightbox') $('lightbox').classList.remove('open'); });

  /* ---------------- Tabs ---------------- */
  $('tabJobs').onclick = ()=>{
    $('tabJobs').classList.add('active'); $('tabContractors').classList.remove('active');
    $('jobsView').style.display='block'; $('contractorsView').classList.remove('open');
  };
  $('tabContractors').onclick = async ()=>{
    $('tabJobs').classList.remove('active'); $('tabContractors').classList.add('active');
    $('jobsView').style.display='none'; $('contractorsView').classList.add('open');
    renderContractors();
  };
  $('contractorsBtn').onclick = ()=> $('tabContractors').click();

  $('addContractorBtn').onclick = async ()=>{
    const name = $('newCtName').value.trim();
    const email = $('newCtEmail').value.trim().toLowerCase();
    if(!name){ alert('Enter a name'); return; }
    if(!email || !email.includes('@')){ alert('Enter a valid email'); return; }
    try{
      const res = await fetch(`${SUPABASE_URL}/rest/v1/contractors`, {
        method:'POST',
        headers:{...authHeaders(),'Prefer':'resolution=merge-duplicates,return=minimal'},
        body: JSON.stringify({ name, email, active: true })
      });
      if(!res.ok) throw new Error('Failed to add contractor');
      $('newCtName').value=''; $('newCtEmail').value='';
      await loadContractors();
      renderContractors();
      toast(`${name} added as a contractor`);
    }catch(e){ alert('Could not add contractor: ' + e.message); }
  };

  /* ---------------- Contractors data ---------------- */
  let contractors = [];
  async function loadContractors(){
    try{
      const res = await fetch(`${SUPABASE_URL}/rest/v1/contractors?select=*&active=eq.true&order=name`, { headers: authHeaders() });
      if(res.ok) contractors = await res.json();
    }catch(e){ console.error('Could not load contractors', e); }
  }

  function renderContractors(){
    const area = $('contractorsList');
    area.innerHTML = '';
    if(!contractors.length){ area.innerHTML = '<div class="empty-msg">No contractors yet.</div>'; return; }

    contractors.forEach(c=>{
      const myJobs = allJobs.filter(j=> j.assigned_to === c.email || (j.data && j.data.assignedTo === c.email));
      const activeJobs = myJobs.filter(j=> j.status !== 'archived');
      const submitted = activeJobs.filter(j=> j.status === 'submitted').length;
      const inProgress = activeJobs.filter(j=> j.status === 'in_progress').length;

      const section = document.createElement('div');
      section.className = 'contractor-section';

      const head = document.createElement('div');
      head.className = 'contractor-section-head';
      head.innerHTML = `
        <div class="contractor-avatar">${(c.name||'?')[0].toUpperCase()}</div>
        <div style="flex:1">
          <div class="cn">${escapeHtml(c.name)}</div>
          <div style="font-size:11.5px; color:rgba(255,255,255,0.65);">${escapeHtml(c.email)}</div>
        </div>
        <div class="stats">${inProgress} active · ${submitted} submitted</div>
      `;
      section.appendChild(head);

      if(activeJobs.length === 0){
        const empty = document.createElement('div');
        empty.style.cssText = 'padding:12px 14px; background:var(--paper); border:1.5px solid var(--line); border-top:none; border-radius:0 0 12px 12px; font-size:13px; color:var(--slate);';
        empty.textContent = 'No active jobs assigned';
        section.appendChild(empty);
      } else {
        activeJobs.forEach((j, idx)=>{
          const d = j.data || {};
          const row = document.createElement('div');
          row.className = 'contractor-job-row';
          if(idx === activeJobs.length - 1) row.style.borderRadius = '0 0 12px 12px';
          const pct = computePctForJob(d);
          const statusLabel = j.status === 'submitted' ? '✓ Submitted' : `${pct}% complete`;
          row.innerHTML = `
            <div class="jname">${escapeHtml(d.name || d.client || 'Untitled job')}</div>
            <div class="jmeta">${escapeHtml(d.address||'—')} · ${statusLabel}</div>
            <div class="status-pill ${j.status}" style="font-size:9px; padding:2px 6px;">${j.status === 'submitted'?'Submitted':'In progress'}</div>
          `;
          row.onclick = ()=>{ openDetail(j); $('tabJobs').click(); };
          section.appendChild(row);
        });
      }
      area.appendChild(section);
    });

    // Unassigned jobs section
    const unassigned = allJobs.filter(j=> !j.assigned_to && !(j.data && j.data.assignedTo) && j.status !== 'archived');
    if(unassigned.length){
      const section = document.createElement('div');
      section.className = 'contractor-section';
      section.innerHTML = `<div class="contractor-section-head" style="background:var(--slate);">
        <div class="contractor-avatar" style="background:rgba(255,255,255,0.15);">?</div>
        <div style="flex:1"><div class="cn">Unassigned</div></div>
        <div class="stats">${unassigned.length} job${unassigned.length>1?'s':''}</div>
      </div>`;
      unassigned.forEach((j, idx)=>{
        const d = j.data || {};
        const row = document.createElement('div');
        row.className = 'contractor-job-row';
        if(idx === unassigned.length - 1) row.style.borderRadius = '0 0 12px 12px';
        row.innerHTML = `
          <div class="jname">${escapeHtml(d.name || d.client || 'Untitled job')}</div>
          <div class="jmeta">${escapeHtml(d.address||'—')}</div>
          <button class="card-btn assign" style="flex:none;">Assign</button>
        `;
        row.querySelector('.card-btn.assign').onclick = e=>{ e.stopPropagation(); openAssignModal(j); };
        row.onclick = ()=>{ openDetail(j); $('tabJobs').click(); };
        section.appendChild(row);
      });
      area.appendChild(section);
    }
  }

  /* ---------------- Assign modal ---------------- */
  let assignTargetJob = null;
  function openAssignModal(j){
    assignTargetJob = j;
    const d = j.data || {};
    $('assignJobLabel').textContent = (d.name || d.client || 'Untitled job') + (d.address ? ' · ' + d.address : '');
    $('assignCustomEmail').value = '';

    const list = $('assignContractorList');
    list.innerHTML = '';
    contractors.forEach(c=>{
      const isCurrentlyAssigned = j.assigned_to === c.email || (d.assignedTo === c.email);
      const card = document.createElement('div');
      card.className = 'contractor-card' + (isCurrentlyAssigned ? ' selected' : '');
      const myJobs = allJobs.filter(x=> (x.assigned_to===c.email || (x.data&&x.data.assignedTo===c.email)) && x.status!=='archived').length;
      card.innerHTML = `
        <div class="contractor-avatar">${(c.name||'?')[0].toUpperCase()}</div>
        <div class="contractor-info">
          <div class="cn">${escapeHtml(c.name)} ${isCurrentlyAssigned?'<span style="color:var(--green);font-size:11px;">● Assigned</span>':''}</div>
          <div class="ce">${escapeHtml(c.email)}</div>
          <div class="cj">${myJobs} active job${myJobs!==1?'s':''}</div>
        </div>
      `;
      card.onclick = ()=> assignJob(c.email, c.name);
      list.appendChild(card);
    });

    $('assignModal').style.display = 'flex';
  }

  $('assignCloseBtn').onclick = ()=> $('assignModal').style.display = 'none';
  $('assignModal').addEventListener('click', e=>{ if(e.target.id==='assignModal') $('assignModal').style.display='none'; });

  $('assignCustomBtn').onclick = ()=>{
    const email = $('assignCustomEmail').value.trim();
    if(!email || !email.includes('@')){ alert('Enter a valid email'); return; }
    assignJob(email, email);
  };

  async function assignJob(email, name){
    if(!assignTargetJob) return;
    const j = assignTargetJob;
    try{
      await fetch(`${SUPABASE_URL}/rest/v1/jobs?id=eq.${encodeURIComponent(j.id)}`, {
        method:'PATCH', headers:{...authHeaders(),'Prefer':'return=minimal'},
        body: JSON.stringify({ assigned_to: email })
      });
      j.assigned_to = email;
      if(j.data) j.data.assignedTo = email;
      $('assignModal').style.display = 'none';
      toast(`Assigned to ${name}`);
      await loadAllJobs();
      renderList();
      if($('contractorsView').classList.contains('open')) renderContractors();
    }catch(e){ alert('Could not assign job'); }
  }

  $('backBtn').onclick = ()=>{
    $('detailOverlay').classList.remove('open');
    currentDetailJob = null;
    renderList();
  };

  /* ---------------- Create / assign job ---------------- */
  function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4); }

  $('createJobBtn').onclick = ()=>{
    $('cjContractor').value=''; $('cjClient').value=''; $('cjAddress').value='';
    $('cjDate').value=''; $('cjName').value='';
    $('cjError').classList.remove('show');
    $('createJobModal').style.display='flex';
  };
  $('createJobCloseBtn').onclick = ()=> $('createJobModal').style.display='none';
  $('createJobModal').addEventListener('click', e=>{ if(e.target.id==='createJobModal') $('createJobModal').style.display='none'; });

  $('cjSaveBtn').onclick = async ()=>{
    const contractor = $('cjContractor').value.trim();
    const err = $('cjError');
    err.classList.remove('show');
    if(!contractor){ err.textContent='Enter the contractor\'s email'; err.classList.add('show'); return; }
    if(!contractor.includes('@')){ err.textContent='Enter a valid email address'; err.classList.add('show'); return; }

    $('cjSaveBtn').disabled=true; $('cjSaveBtn').textContent='Creating…';

    const sections = {};
    const SECT_KEYS = ['arrival','kitchen','bathrooms','bedrooms','living','floors','walkthrough','addons'];
    SECT_KEYS.forEach(key=>{
      if(key==='bathrooms'||key==='bedrooms'){
        sections[key] = [{ id: uid(), label: (key==='bathrooms'?'Bathroom':'Bedroom')+' 1', items:{}, photos:[], itemPhotos:{}, itemNotes:{} }];
      } else if(key==='addons'){
        sections[key] = { items:{} };
      } else {
        sections[key] = { items:{}, photos:[], itemPhotos:{}, itemNotes:{} };
      }
    });

    const jobId = uid();
    const now = Date.now();
    const jobData = {
      id: jobId,
      name: $('cjName').value.trim() || '',
      client: $('cjClient').value.trim(),
      date: $('cjDate').value,
      address: $('cjAddress').value.trim(),
      photo: null,
      serviceLevel: $('cjServiceLevel').value,
      safetyAcknowledged: false,
      safetyAcknowledgedAt: null,
      status: 'in_progress',
      submittedAt: null,
      createdBy: session.email,
      assignedTo: contractor,
      editLedger: [],
      sections,
      createdAt: now,
      updatedAt: now
    };

    try{
      const res = await fetch(`${SUPABASE_URL}/rest/v1/jobs`, {
        method:'POST',
        headers:{...authHeaders(),'Prefer':'resolution=merge-duplicates,return=minimal'},
        body: JSON.stringify({
          id: jobId,
          data: jobData,
          status: 'in_progress',
          created_by: session.email,
          assigned_to: contractor,
          updated_at: new Date(now).toISOString()
        })
      });
      if(!res.ok) throw new Error('Could not create job: '+res.status);
      $('createJobModal').style.display='none';
      await loadAllJobs();
      renderList();
      toast(`Job assigned to ${contractor}`);
    }catch(e){
      err.textContent = e.message || 'Could not create job';
      err.classList.add('show');
    }finally{
      $('cjSaveBtn').disabled=false; $('cjSaveBtn').textContent='Create & Assign Job';
    }
  };

  $('archiveJobBtn').onclick = async ()=>{
    if(!currentDetailJob) return;
    const j = currentDetailJob;
    const isArchived = j.status === 'archived';
    const newStatus = isArchived ? (j.data && j.data.submittedAt ? 'submitted' : 'in_progress') : 'archived';
    try{
      await fetch(`${SUPABASE_URL}/rest/v1/jobs?id=eq.${encodeURIComponent(j.id)}`, {
        method:'PATCH', headers:{...authHeaders(),'Prefer':'return=minimal'},
        body: JSON.stringify({ status: newStatus, archived_at: isArchived ? null : new Date().toISOString() })
      });
      j.status = newStatus;
      toast(isArchived ? 'Job unarchived' : 'Job archived');
      $('detailOverlay').classList.remove('open');
      currentDetailJob = null;
      await loadAllJobs();
      renderList();
    }catch(e){ alert('Could not archive job'); }
  };

  $('saveJobBtn').onclick = async ()=>{
    if(!currentDetailJob) return;
    const j = currentDetailJob;
    const d = j.data;
    d.updatedAt = Date.now();
    $('saveJobBtn').disabled = true;
    $('saveJobBtn').textContent = 'Saving…';
    $('saveStatus').textContent = '';
    try{
      const res = await fetch(`${SUPABASE_URL}/rest/v1/jobs?id=eq.${encodeURIComponent(j.id)}`, {
        method:'PATCH',
        headers: { ...authHeaders(), 'Prefer':'return=minimal' },
        body: JSON.stringify({
          data: d,
          status: j.status,
          submitted_at: d.submittedAt ? new Date(d.submittedAt).toISOString() : null,
          updated_at: new Date(d.updatedAt).toISOString()
        })
      });
      if(!res.ok) throw new Error('Save failed: '+res.status);
      j.updated_at = new Date(d.updatedAt).toISOString();
      $('saveStatus').textContent = 'Saved.';
      detailMode = 'view';
      updateModeTabs();
      renderDetail();
    }catch(e){
      console.error(e);
      $('saveStatus').textContent = 'Could not save — check your connection.';
    }finally{
      $('saveJobBtn').disabled = false;
      $('saveJobBtn').textContent = 'Save changes';
    }
  };

  $('deleteJobBtn').onclick = async ()=>{
    if(!currentDetailJob) return;
    const j = currentDetailJob;
    const name = (j.data && j.data.name) || 'Untitled job';
    if(!confirm(`Delete "${name}"? This can't be undone.`)) return;
    try{
      const res = await fetch(`${SUPABASE_URL}/rest/v1/jobs?id=eq.${encodeURIComponent(j.id)}`, {
        method:'DELETE', headers: authHeaders()
      });
      if(!res.ok) throw new Error('Delete failed: '+res.status);
      allJobs = allJobs.filter(x=>x.id !== j.id);
      currentDetailJob = null;
      $('detailOverlay').classList.remove('open');
      renderList();
    }catch(e){
      console.error(e);
      alert('Could not delete — check your connection.');
    }
  };
  $('searchInput').addEventListener('input', renderList);
  $('statusFilter').addEventListener('change', renderList);

  /* ---------------- Login flow ---------------- */
  function showLoginError(msg){ const el=$('loginError'); el.textContent=msg; el.classList.add('show'); }

  $('loginBtn').onclick = async ()=>{
    const email = $('loginEmail').value.trim();
    const password = $('loginPassword').value;
    $('loginError').classList.remove('show');
    $('notAdminMsg').style.display = 'none';
    if(!email || !password){ showLoginError('Enter your email and password'); return; }
    $('loginBtn').disabled = true; $('loginBtn').textContent = 'Signing in…';
    try{
      await signIn(email, password);
      if(!isAdmin()){
        $('notAdminMsg').style.display = 'block';
        clearSession();
        return;
      }
      $('loginGate').classList.add('hidden');
      await Promise.all([loadAllJobs(), loadContractors()]);
      renderList();
    }catch(e){
      showLoginError(e.message || 'Could not sign in.');
    }finally{
      $('loginBtn').disabled = false; $('loginBtn').textContent = 'Log In';
    }
  };
  $('loginPassword').addEventListener('keydown', e=>{ if(e.key==='Enter') $('loginBtn').click(); });

  $('logoutBtn').onclick = ()=>{
    if(!confirm('Log out?')) return;
    clearSession();
    location.reload();
  };

  (async function init(){
    const s = await ensureSession();
    if(s && isAdmin()){
      session = s;
      $('loginGate').classList.add('hidden');
      await Promise.all([loadAllJobs(), loadContractors()]);
      renderList();
    } else {
      if(s && !isAdmin()){ $('notAdminMsg').style.display = 'block'; clearSession(); }
      $('loginGate').classList.remove('hidden');
    }
  })();

})();
</script>
</body>
</html>
